[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-reliability-lab"
version = "1.0.0"
description = "A typed Python integration lab for predictable behavior under partial failure"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Darshak" }]
keywords = ["asyncio", "circuit-breaker", "reliability", "retry", "rate-limit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/darshakm/python-reliability-lab"
Repository = "https://github.com/darshakm/python-reliability-lab"
Issues = "https://github.com/darshakm/python-reliability-lab/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reliability_lab"]

[tool.hatch.build.targets.sdist]
exclude = ["/outputs"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
